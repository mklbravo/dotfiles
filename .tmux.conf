set -g prefix C-a                           # Prefix
unbind C-b                                  # Change prefix key to C-a, easier to type, same

set -asq terminal-features ',xterm-ghostty:title'
set -g base-index 1                         # Start windows index on 1
set -g default-terminal "xterm-256color"
set -gq extended-keys on                    # Optional on older tmux versions
set -gq extended-keys-format csi-u           # Optional on older tmux versions
set -g mouse on
set -g renumber-windows on                  # Renumber windows after closing one
set -g set-titles on                        # Set outer terminal (Ghostty) title
set -g set-titles-string "#S"               # Title = session name
set -g status-position top                  # macOS / darwin style

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"
bind X kill-session

# Better splitting
bind _ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# ----- List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'mklbravo/tmux-theme'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell 'test -f "$HOME/.tmux/plugins/tpm/tpm"' 'run-shell "~/.tmux/plugins/tpm/tpm"'
